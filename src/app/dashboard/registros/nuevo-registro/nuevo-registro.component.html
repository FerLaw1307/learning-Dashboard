<form (ngSubmit)="onSubmit(tituloIngresado.value, pedidoIngresado.value)">
    <app-control label="Título">
        <input name="titulo" id="titulo" #tituloIngresado>
    </app-control>
    <app-control label="Pedido">
        <textarea name="pedido" id="pedido" row="3" #pedidoIngresado></textarea>
    </app-control>
    <p>
        <button appButton>
            Enviar 
        </button>
    </p>
</form>
