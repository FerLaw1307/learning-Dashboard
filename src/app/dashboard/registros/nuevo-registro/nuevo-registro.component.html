<form (ngSubmit)="alEnviar()" #miFormulario>
    <app-control label="Título">
        <input name="titulo" id="titulo" #input [(ngModel)]="tituloIngresado" />
    </app-control>
    <app-control label="Pedido">
        <textarea name="pedido" id="pedido" row="3" #input [(ngModel)]="textoIngresado"></textarea>
    </app-control>
    <p>
        <button appButton>
            Enviar 
        </button>
    </p>
</form>
